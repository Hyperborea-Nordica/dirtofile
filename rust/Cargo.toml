[package]
name = "dirtofile"
version = "1.0.0"
edition = "2021"
authors = ["Your Name"]
description = "CLI utility to pack directory contents into a single file"
license = "MIT"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
walkdir = "2.4"
flate2 = "1.0"
tar = "0.4"
globset = "0.4"

[dev-dependencies]
tempfile = "3.10"
proptest = "1.4"
